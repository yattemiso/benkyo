<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はじめてのWebサイト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background-color: #fff8d9;
      color: #3d3522;
      font-family: sans-serif;
      line-height: 1.8;
    }

    .card {
      width: min(100%, 580px);
      padding: 32px 24px;
      border: 3px solid #f0c94d;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 8px 0 #ead58b;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .animals {
      margin: 0 0 8px;
      font-size: 2.8rem;
    }

    h1 {
      margin: 0 0 16px;
      color: #654b00;
      font-size: clamp(1.7rem, 6vw, 2.3rem);
    }

    .welcome {
      padding: 16px;
      border-radius: 18px;
      background: #fff8e7;
    }

    .link-button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      border: 2px solid #654b00;
      border-radius: 999px;
      background: #ffdf6e;
      color: #3d2e00;
      font-weight: bold;
      text-decoration: none;
    }

    .link-button:hover,
    .link-button:focus-visible {
      background: #ffcf32;
      outline: 3px solid #654b00;
      outline-offset: 3px;
    }

    .note {
      margin: 22px 0 0;
      color: #594f38;
      font-size: 0.9rem;
    }

    .more-invite {
      margin: 18px 0 0;
      padding: 8px;
      background: #fff;
    }

    .coming-soon {
      margin: 4px 0 16px;
      color: #756b55;
      font-size: 0.78rem;
    }

    .decorations {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .decorations img {
      position: absolute;
      width: 300px;
    }

    .decorations img:nth-child(1) { top: 5%; left: 5%; }
    .decorations img:nth-child(2) { top: 12%; right: 5%; }
    .decorations img:nth-child(3) { top: 45%; left: 2%; }
    .decorations img:nth-child(4) { top: 50%; right: 3%; }
    .decorations img:nth-child(5) { bottom: 5%; left: 8%; }
    .decorations img:nth-child(6) { bottom: 4%; right: 8%; }
  </style>
</head>
<body>
  <div class="decorations" aria-hidden="true">
    <img src="images/topbg-decoration.png" alt="">
    <img src="images/topbg-decoration.png" alt="">
    <img src="images/topbg-decoration.png" alt="">
    <img src="images/topbg-decoration.png" alt="">
    <img src="images/topbg-decoration.png" alt="">
    <img src="images/topbg-decoration.png" alt="">
  </div>

  <main class="card">
    <p class="animals" aria-label="ハムスターとくま">🐹 🐻</p>
    <h1>はじめてのWebサイト 🎉</h1>

    <div class="welcome">
      <p>GitHub PagesとGeminiと作った、はじめてのWebサイトです！</p>
      <p>遊びに来てくれてありがとう🍬</p>
    </div>

    <p class="more-invite">こちらのページも見てみてね 👀</p>
    <p class="coming-soon">コンテンツは順次追加予定 (⌒∇⌒)</p>

    <a class="link-button" href="github-guide/index.html">
      🐻 GitHubを使ったWebサイトのつくりかた
    </a>

    <a class="link-button" href="fortune-type-site/index.html">
      🌷 タイプ診断・今日の運勢へ
    </a>

    <p class="note">🐻 ゆっくり楽しんでいってね 🐹</p>


  </main>
</body>
</html>
