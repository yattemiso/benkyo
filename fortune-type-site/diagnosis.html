<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイプ診断｜ふんわりタイプ占い</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <a class="text-link" href="index.html">← ホームへ戻る</a>
    <p class="eyebrow">TYPE DIAGNOSIS</p>
    <h1>かんたんタイプ診断 🌼</h1>
    <p class="intro">3つの質問に、直感で答えてみてください。</p>

    <form id="diagnosis-form">
      <fieldset class="question">
        <legend>1. あなたは社交的ですか？</legend>
        <label><input type="radio" name="q1" value="yes" required> はい</label>
        <label><input type="radio" name="q1" value="no"> いいえ</label>
      </fieldset>

      <fieldset class="question">
        <legend>2. 物事を計画するのが好きですか？</legend>
        <label><input type="radio" name="q2" value="yes" required> はい</label>
        <label><input type="radio" name="q2" value="no"> いいえ</label>
      </fieldset>

      <fieldset class="question">
        <legend>3. 感情を重視しますか？</legend>
        <label><input type="radio" name="q3" value="yes" required> はい</label>
        <label><input type="radio" name="q3" value="no"> いいえ</label>
      </fieldset>

      <button class="button" type="submit">診断する</button>
    </form>

    <section id="result" class="result" hidden aria-live="polite">
      <h2>あなたの診断結果</h2>
      <div id="result-illustration" class="result-illustration" aria-hidden="true"></div>
      <h3 id="result-title" class="result-title"></h3>
      <p id="result-text"></p>
      <p>このタイプの今日の運勢も見てみましょう。</p>
      <a id="fortune-link" class="button" href="fortune.html">今日の運勢を見る</a>
    </section>

    <p class="note">
      診断のしくみ：回答を「はい＝1」「いいえ＝2」に置き換え、
      3つの数字の組み合わせからタイプを選んでいます。
    </p>
  </main>

  <script src="js/diagnosis.js"></script>
</body>
</html>
