<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日の運勢｜ふんわりタイプ占い</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <a class="text-link" href="index.html">← ホームへ戻る</a>
    <p class="eyebrow">TODAY'S FORTUNE</p>
    <h1>今日の運勢 🔮</h1>

    <section id="fortune-content" class="result fortune-result" hidden aria-live="polite">
      <p class="fortune-type-label">あなたのタイプ</p>
      <div id="type-illustration" class="type-illustration" aria-hidden="true"></div>
      <h2 id="type-name" class="fortune-type-name"></h2>

      <div class="weather-box">
        <div id="weather-icon" class="weather-icon" aria-hidden="true"></div>
        <p id="weather-label" class="weather-label"></p>
      </div>

      <p id="fortune-message" class="fortune-message"></p>
      <p id="lucky-item" class="lucky-item"></p>
    </section>

    <section id="no-type" class="info" hidden>
      <p>先にタイプ診断をすると、そのタイプの今日の運勢を見られます。</p>
      <a class="button" href="diagnosis.html">タイプ診断をする</a>
    </section>

    <p class="note">運勢はページを開くたびにランダムで変わります。</p>
  </main>

  <script src="js/fortune.js"></script>
</body>
</html>
